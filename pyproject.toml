[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-voyager"
version = "0.1.0"
description = "A deterministic Minecraft-like scaffold for verified skill learning."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
schema-voyager-demo = "schema_voyager.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
